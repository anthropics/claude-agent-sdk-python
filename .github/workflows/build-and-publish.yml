name: Build and Publish

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string
      previous_tag:
        description: 'Previous release tag for changelog generation'
        required: false
        type: string
        default: ''

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          pip install build twine wheel
          pip install --require-hashes --only-binary :all: -r scripts/requirements-recompress.txt
        shell: bash

      - name: Build wheel with bundled CLI
        run: python scripts/build_wheel.py --version "${{ inputs.version }}" --skip-sdist --clean --recompress zopfli
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      # Required to mint the OIDC token exchanged for a Claude API access token (Workload Identity Federation)
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update version files
        run: python scripts/update_version.py "$VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Verify all expected wheels are present
        run: |
          set -euo pipefail
          ls -la dist/
          expected=(
            "macosx_11_0_arm64"
            "macosx_11_0_x86_64"
            "manylinux_2_17_x86_64"
            "manylinux_2_17_aarch64"
            "win_amd64"
          )
          for tag in "${expected[@]}"; do
            if ! ls dist/*"${tag}".whl 2>/dev/null; then
              echo "::error::Missing wheel for platform tag: ${tag}"
              exit 1
            fi
          done
          echo "All ${#expected[@]} expected wheels present ✓"

      - name: Install build dependencies
        run: pip install build twine

      - name: Build sdist
        run: |
          python -m build --sdist --outdir sdist/
          ls -la sdist/

      - name: Pre-flight PyPI quota check
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          import urllib.request

          QUOTA_BYTES = 50 * 1024**3        # PyPI project quota (increased from default 10 GiB)
          # Temporary: fail above 49.9 GiB (0.1 GiB buffer). Safe only if QUOTA_BYTES is
          # PyPI's real quota. When PyPI raises it, update QUOTA_BYTES and set this to
          # 95% of it. Also update PYPI_PROJECT_LIMIT_BYTES in scripts/check_pypi_quota.py.
          THRESHOLD_BYTES = 49.9 * 1024**3
          # PyPI's default per-file limit. If PyPI raises it for this project, update this
          # and PYPI_FILE_LIMIT_BYTES in scripts/check_pypi_quota.py.
          FILE_LIMIT_BYTES = 100 * 1024**2

          version = os.environ.get("VERSION", "")

          # PyPI rejects any file above its per-file limit, and the upload step sends the
          # files one at a time, so an oversized file would stop the upload part-way. A wheel
          # that is too large is left out of the upload, with a warning, so that the rest of
          # the release still goes out. `pip install` on that platform then gets the sdist,
          # which has no bundled CLI. Keep this check above the PyPI fetch, so that it still
          # runs and names the file when the fetch fails.
          sizes = []
          for d in ("dist", "sdist"):
              if os.path.isdir(d):
                  for fn in sorted(os.listdir(d)):
                      sizes.append((os.path.getsize(os.path.join(d, fn)), d, fn))
          if sizes:
              size, _, fn = max(sizes)
              print(f"Largest file:       {size / 1024**2:.2f} MiB of the {FILE_LIMIT_BYTES / 1024**2:.0f} MiB PyPI per-file limit ({size:,} bytes, {fn})")
          limit = (
              f"PyPI's per-file limit is {FILE_LIMIT_BYTES:,} bytes "
              f"({FILE_LIMIT_BYTES / 1024**2:.0f} MiB), as recorded in FILE_LIMIT_BYTES in "
              ".github/workflows/build-and-publish.yml."
          )
          fix = (
              "Make each listed file smaller, or ask PyPI to raise this project's per-file "
              "limit (https://docs.pypi.org/project-management/storage-limits/) and then "
              "raise FILE_LIMIT_BYTES to match."
          )
          oversized = [(size, d, fn) for size, d, fn in sizes if size > FILE_LIMIT_BYTES]
          names = ", ".join(f"{fn} ({size:,} bytes)" for size, _, fn in oversized)
          # Only wheels can be left out. Without the sdist there is nothing to fall back to,
          # and without any wheel the release would bundle the CLI for nobody.
          wheels_left = [fn for size, d, fn in sizes if d == "dist" and size <= FILE_LIMIT_BYTES]
          if any(d != "dist" for _, d, _ in oversized) or (oversized and not wheels_left):
              print(
                  f"::error::Too large for PyPI: {names}. {limit} "
                  f"This run uploaded nothing to PyPI. {fix}"
              )
              sys.exit(1)
          if oversized:
              for _, d, fn in oversized:
                  os.remove(os.path.join(d, fn))
              print(
                  f"::warning::Not published to PyPI, too large: {names}. {limit} "
                  "The rest of this release goes ahead without them. `pip install` on each platform "
                  "listed gets the sdist, which has no bundled CLI. The wheels are still in "
                  f"this run's build artifacts. {fix}"
              )

          # Fetch current usage from PyPI JSON API
          try:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/claude-agent-sdk/json", timeout=30
              ) as r:
                  data = json.load(r)
          except Exception as exc:
              # Fail closed: without the current size, an upload could run into PyPI's
              # quota part-way and leave only some of the release's files public.
              print(f"::error::Could not read this project's current size from PyPI: {exc}")
              print("Nothing was uploaded. Re-run this job once pypi.org responds.")
              sys.exit(1)

          current_total = sum(
              f["size"]
              for files in data["releases"].values()
              for f in files
          )

          # Collect filenames already uploaded for the current version so we
          # don't double-count them when summing local artifacts (re-run after
          # a partial upload).
          already_uploaded = set()
          if version and version in data["releases"]:
              already_uploaded = {f["filename"] for f in data["releases"][version]}

          # Sum local artifacts about to be uploaded, skipping already-uploaded files
          new_total = 0
          for d in ("dist", "sdist"):
              if os.path.isdir(d):
                  for fn in os.listdir(d):
                      if fn in already_uploaded:
                          print(f"  (skipping already-uploaded file: {fn})")
                          continue
                      new_total += os.path.getsize(os.path.join(d, fn))

          projected = current_total + new_total
          pct = 100.0 * current_total / QUOTA_BYTES
          projected_pct = 100.0 * projected / QUOTA_BYTES

          print(f"Current PyPI usage: {current_total / 1024**3:.3f} GiB / {QUOTA_BYTES / 1024**3:.0f} GiB ({pct:.1f}%)")
          print(f"New upload size:    {new_total / 1024**2:.2f} MiB")
          print(f"Projected usage:    {projected / 1024**3:.3f} GiB / {QUOTA_BYTES / 1024**3:.0f} GiB ({projected_pct:.1f}%)")

          if projected > THRESHOLD_BYTES:
              print(
                  f"::error::Projected PyPI usage {projected / 1024**3:.3f} GiB exceeds "
                  f"{THRESHOLD_BYTES / 1024**3:.1f} GiB safety threshold. Delete old releases or "
                  f"request a further quota increase at https://pypi.org/help/#project-size-limit "
                  f"before publishing."
              )
              sys.exit(1)
          EOF

      - name: Publish to PyPI (sdist first, then wheels)
        # Upload the tiny sdist first so `pip install` has a universal fallback
        # even if wheel uploads fail partway. --skip-existing makes re-runs
        # safe after a partial upload (PyPI rejects re-uploads of identical
        # filenames, which would otherwise abort the whole job).
        run: |
          twine upload --skip-existing sdist/*.tar.gz
          twine upload --skip-existing dist/*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Commit version changes
        run: |
          git add pyproject.toml src/claude_agent_sdk/_version.py
          git commit -m "chore: release v$VERSION"

      - name: Update changelog with Claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          prompt: "/generate-changelog new version: ${{ env.VERSION }}, old version: ${{ inputs.previous_tag }}"
          # Authenticate to the Claude API via Workload Identity Federation
          # (the workflow's OIDC token is exchanged for a short-lived access
          # token) instead of a static API key.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-4-6
            --allowedTools 'Bash(git add:*),Bash(git commit:*),Edit'

      - name: Push to main
        run: |
          git remote set-url origin git@github.com:anthropics/claude-agent-sdk-python.git
          git push origin main

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

          awk -v ver="$VERSION" '/^## / { if (found) exit; if ($2 == ver) found=1; next } found { print }' CHANGELOG.md > release_notes.md
          echo -e "\n---\n\n**PyPI:** https://pypi.org/project/claude-agent-sdk/$VERSION/\n\n\`\`\`bash\npip install claude-agent-sdk==$VERSION\n\`\`\`" >> release_notes.md

          gh release create "v$VERSION" --title "v$VERSION" --notes-file release_notes.md
