name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    # - "src/**/*.ts"
    # - "src/**/*.tsx"
    # - "src/**/*.js"
    # - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip on forks since they don't have access to secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    # This job calls Claude, so it runs on GitHub's egress-firewall runner, which
    # filters the job's outbound network traffic (allow list: .github/egress-firewall.yaml).
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Run Claude Code Review
      id: claude-review
      uses: anthropics/claude-code-action@v1
      with:
        # Authenticate to the Claude API via Workload Identity Federation
        # (the workflow's OIDC token is exchanged for a short-lived access
        # token) instead of a static API key.
        anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
        anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
        anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

        # --permission-mode auto: a tool call that needs permission runs only if Claude Code's
        # safety review passes it. This step passes no --allowedTools list.
        claude_args: --model claude-opus-4-6 --permission-mode auto

        # Direct prompt for automated review (no @claude mention needed)
        prompt: |
          Please review this pull request and provide feedback on:
          - Code quality and best practices
          - Potential bugs or issues
          - Performance considerations
          - Security concerns
          - Test coverage

          Be constructive and helpful in your feedback.

        # Optional: Customize review based on file types
        # prompt: |
        #   Review this PR focusing on:
        #   - For TypeScript files: Type safety and proper interface usage
        #   - For API endpoints: Security, input validation, and error handling
        #   - For React components: Performance, accessibility, and reusability
        #   - For test files: Coverage, edge cases, and test quality