name: Publish dry run (scratch)

on:
  push:
    branches: [scratch/publish-dry-run]

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the release steps against a local upload server
        run: |
          python -m venv /tmp/tools
          /tmp/tools/bin/pip install -q pyyaml
          sudo -E env "PATH=$PATH" /tmp/tools/bin/python .github/scratch/publish_dry_run.py
